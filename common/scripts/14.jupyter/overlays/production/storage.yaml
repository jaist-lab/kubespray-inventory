apiVersion: v1
kind: PersistentVolume
metadata:
  name: jupyter-workspace-pv
  labels:
    type: local
    app: jupyter-gpu
spec:
  storageClassName: manual
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/jupyter-workspace

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-workspace-pvc
  namespace: ml-experiments
  labels:
    app: jupyter-gpu
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jupyter-datasets-pv
  labels:
    type: local
    app: jupyter-gpu
spec:
  storageClassName: manual
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/datasets

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-datasets-pvc
  namespace: ml-experiments
  labels:
    app: jupyter-gpu
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
