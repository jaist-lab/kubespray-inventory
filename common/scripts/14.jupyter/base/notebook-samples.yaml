    {
     "cells": [
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "# クイックスタート - 環境確認\n",
        "\n",
        "このNotebookでは、環境の基本確認を行います。"
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "import torch\n",
        "import numpy as np\n",
        "import matplotlib.pyplot as plt\n",
        "\n",
        "print(f\"PyTorch: {torch.__version__}\")\n",
        "print(f\"CUDA available: {torch.cuda.is_available()}\")\n",
        "\n",
        "if torch.cuda.is_available():\n",
        "    print(f\"GPU count: {torch.cuda.device_count()}\")\n",
        "    for i in range(torch.cuda.device_count()):\n",
        "        print(f\"GPU {i}: {torch.cuda.get_device_name(i)}\")\n",
        "        print(f\"  Memory: {torch.cuda.get_device_properties(i).total_memory / 1024**3:.1f} GB\")\n",
        "else:\n",
        "    print(\"CPU mode\")"
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\n",
        "print(f\"Device: {device}\")\n",
        "\n",
        "size = 2048\n",
        "a = torch.randn(size, size, device=device)\n",
        "b = torch.randn(size, size, device=device)\n",
        "\n",
        "import time\n",
        "start = time.time()\n",
        "c = torch.matmul(a, b)\n",
        "if device.type == 'cuda':\n",
        "    torch.cuda.synchronize()\n",
        "elapsed = time.time() - start\n",
        "\n",
        "gflops = (2 * size**3) / (elapsed * 1e9)\n",
        "print(f\"FP32 {size}x{size}: {elapsed:.4f}s, {gflops:.1f} GFLOPS\")"
       ]
      }
     ],
     "metadata": {
      "kernelspec": {"display_name": "Python 3", "language": "python", "name": "python3"},
