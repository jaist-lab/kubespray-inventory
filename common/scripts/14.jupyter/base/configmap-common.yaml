apiVersion: v1
kind: ConfigMap
metadata:
  name: jupyter-startup-config
  namespace: ml-experiments
  labels:
    app: jupyter-gpu
data:
  start-jupyter.sh: |
    #!/bin/bash
    set -e

    echo "Jupyter Notebook環境 起動開始"
    echo "========================================"

    # 必要なPythonパッケージインストール
    pip install matplotlib jupyter jupyterlab --quiet

    # Matplotlib設定
    python -c "
    import matplotlib.pyplot as plt
    plt.rcParams['font.family'] = 'DejaVu Sans'
    plt.rcParams['axes.unicode_minus'] = False
    print('Matplotlib設定完了')
    "

    # PyTorch確認
    python -c "
    import torch
    print(f'PyTorch version: {torch.__version__}')
    print(f'CUDA available: {torch.cuda.is_available()}')
    "

    # 作業ディレクトリの権限設定
    chown -R 1000:1000 /workspace 2>/dev/null || true

    echo "Jupyter Notebook環境設定完了"

    # JupyterLab起動
    exec jupyter lab \
        --ip=0.0.0.0 \
        --port=8888 \
        --no-browser \
        --allow-root \
        --notebook-dir=/workspace \
        --ServerApp.token='' \
        --ServerApp.password='' \
        --ServerApp.allow_remote_access=True \
        --ServerApp.disable_check_xsrf=True

  sample-data-generator.py: |
    #!/usr/bin/env python3
    import numpy as np
    import pandas as pd
    import json
    import os

    def create_sample_data():
        os.makedirs('/workspace/data/samples', exist_ok=True)
        os.makedirs('/workspace/models/pretrained', exist_ok=True)
        os.makedirs('/workspace/outputs/results', exist_ok=True)

        np.random.seed(42)
        np.save('/workspace/data/samples/sample_data.npy', np.random.randn(1000, 10))

        df = pd.DataFrame({
            'feature_1': np.random.randn(1000),
            'feature_2': np.random.randn(1000),
            'feature_3': np.random.randn(1000),
            'target': np.random.randint(0, 2, 1000)
        })
        df.to_csv('/workspace/data/samples/sample_dataset.csv', index=False)

        config = {
            'model_config': {'hidden_size': 128, 'num_layers': 3, 'dropout': 0.1},
            'training_config': {'batch_size': 64, 'learning_rate': 0.001, 'epochs': 100},
        }
        with open('/workspace/data/samples/sample_config.json', 'w') as f:
            json.dump(config, f, indent=2)

        print("サンプルデータ作成完了")

    if __name__ == "__main__":
        create_sample_data()
