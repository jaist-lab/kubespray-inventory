apiVersion: v1
kind: Service
metadata:
  name: jupyter-gpu-service
  namespace: ml-experiments
  labels:
    app: jupyter-gpu
spec:
  type: ClusterIP
  ports:
  - port: 8888
    targetPort: 8888
    name: jupyter
  - port: 6006
    targetPort: 6006
    name: tensorboard
  - port: 8050
    targetPort: 8050
    name: dash
  selector:
    app: jupyter-gpu
